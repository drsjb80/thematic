name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    # Keep actions updated: check GitHub for latest versions
    # - actions/checkout latest: https://github.com/actions/checkout/releases
    # - actions/setup-node latest: https://github.com/actions/setup-node/releases
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npx eslint src/ --max-warnings 0

    - name: Run tests
      run: npm test
